spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore-db
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

bookstore:
      app:
        jwtSecret: aVeryLongAndSecureSecretKeyForOurBookstoreApplicationThatIsHardToGuess
        jwtExpirationMs: 86400000
# Cấu hình giới hạn file upload (Tăng lên 10MB)
servlet:
  multipart:
    max-file-size: 10MB
    max-request-size: 10MB